name: PR Impact Check

# Sirf report banata hai — ye gate nahi hai. Merge ko rokna ho to "Checks"
# workflow ki `tests` job ko required banao.
on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect changed files
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          {
            echo "CHANGED_FILES<<EOF"
            echo "$CHANGED"
            echo "EOF"
          } >> "$GITHUB_ENV"
      - name: Build the impact report
        run: node scripts/impact-report.mjs > impact.md
        env:
          CHANGED_FILES: ${{ env.CHANGED_FILES }}
      - name: Comment on the PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-impact
          path: impact.md
