name: Auto PR

# Kisi bhi feature branch pe push hote hi PR khul jaata hai aur auto-merge
# on ho jaata hai. Merge tab tak nahi hota jab tak required checks green na hon,
# isliye "push karo, baaki apne aap" wala flow safe rehta hai.
on:
  push:
    branches-ignore:
      - main
      - dev

permissions:
  contents: write
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open the PR and turn on auto-merge
        env:
          # PAT ho to wahi behtar hai: GITHUB_TOKEN se banaya gaya PR doosre
          # workflows trigger nahi karta, yaani impact report aur merge summary
          # nahi chalenge. Check ka gate phir bhi kaam karta hai, kyunki tests
          # job push par bhi chalti hai.
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT || github.token }}
          USING_PAT: ${{ secrets.AUTOMATION_PAT != '' }}
          BRANCH: ${{ github.ref_name }}
          BASE: dev
        run: |
          set -euo pipefail

          if [ "$USING_PAT" != "true" ]; then
            echo "::warning::AUTOMATION_PAT set nahi hai — GITHUB_TOKEN se PR ban raha hai." \
                 "Is PR par pull_request wale workflows (impact report, merge summary) nahi chalenge."
          fi

          # Base se aage kuch hai bhi ya nahi — warna khaali PR ban jaayega.
          if [ -z "$(git log --oneline "origin/$BASE..HEAD")" ]; then
            echo "$BRANCH par $BASE se aage koi commit nahi hai. Kuch nahi karna."
            exit 0
          fi

          PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')

          if [ -z "$PR" ]; then
            TITLE=$(git log -1 --pretty=%s)
            gh pr create \
              --base "$BASE" \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body "$(git log --pretty='- %s' "origin/$BASE..HEAD")"
            PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
            echo "PR #$PR banaya."
          else
            echo "PR #$PR pehle se khula hai."
          fi

          # Auto-merge repo setting off ho to ye fail hota hai — us case mein
          # PR khula rehta hai, bas merge manual karna padega.
          if gh pr merge "$PR" --auto --squash; then
            echo "PR #$PR par auto-merge on hai. Checks green hote hi merge ho jayega."
          else
            echo "::warning::Auto-merge on nahi ho paaya." \
                 "Settings > General > Pull Requests mein 'Allow auto-merge' enable karo."
          fi
