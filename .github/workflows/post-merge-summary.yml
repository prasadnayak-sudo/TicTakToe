name: Post-merge Summary

# Merge ke baad chalta hai — PR band hone par, sirf tab jab wo actually merge hua ho.
on:
  pull_request:
    types: [closed]
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  summary:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Collect merge data
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo "CHANGED_FILES<<GHEOF"
            git diff --name-only "$BASE_SHA...$HEAD_SHA"
            echo "GHEOF"
            echo "COMMIT_LINES<<GHEOF"
            git log --format='%s' "$BASE_SHA..$HEAD_SHA"
            echo "GHEOF"
          } >> "$GITHUB_ENV"

          # Diff AI ko bhejne ke liye — lock file bahar, aur size capped,
          # warna prompt bahut bada ho jata hai.
          git diff "$BASE_SHA...$HEAD_SHA" -- . ':(exclude)package-lock.json' \
            | head -c 60000 > /tmp/diff.txt

      # Ye hissa hamesha chalta hai — AI ke bharose nahi hai.
      - name: Build the deterministic summary
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: node scripts/merge-summary.mjs > /tmp/summary.md

      - name: Check whether Copilot is configured
        id: check
        env:
          COPILOT_PAT: ${{ secrets.COPILOT_PAT }}
        run: |
          if [ -n "$COPILOT_PAT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "COPILOT_PAT secret is not set — posting the deterministic summary only." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build the Copilot prompt
        if: steps.check.outputs.enabled == 'true'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          {
            echo "Below is the diff of a pull request that was just merged."
            echo "Write a summary of it in English."
            echo
            echo "Format:"
            echo "- 2-3 lines: what this merge changed, from a user/product point of view."
            echo "- A '### What to watch' heading with 2-4 bullets:"
            echo "  risky bits, missing tests, or follow-ups worth doing."
            echo "- Call out any behaviour change separately."
            echo
            echo "Rules: only state what the diff actually shows. Do not guess."
            echo "Do not use headings larger than '###'. Do not paste the diff back."
            echo
            echo "PR title: $PR_TITLE"
            echo
            echo "PR description:"
            echo "$PR_BODY"
            echo
            echo "Diff:"
            echo '```diff'
            cat /tmp/diff.txt
            echo '```'
          } > /tmp/prompt.txt

      - name: Install the Copilot CLI
        if: steps.check.outputs.enabled == 'true'
        run: npm install -g @github/copilot

      # AI fail ho jaye to bhi summary post honi chahiye — isliye continue-on-error.
      - name: Ask Copilot for a summary
        id: ai
        if: steps.check.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/ai-inference@v1
        with:
          prompt-file: /tmp/prompt.txt
          model: claude-sonnet-4.5
          system-prompt: >-
            You are a senior engineer writing a short, plain summary of changes
            that were just merged. Write in English. Only state what the diff
            clearly shows.
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}

      - name: Append the Copilot section
        if: steps.ai.outcome == 'success' && steps.ai.outputs.response != ''
        env:
          AI_RESPONSE: ${{ steps.ai.outputs.response }}
        run: |
          {
            echo
            echo "### 🤖 Copilot summary"
            echo
            echo "$AI_RESPONSE"
          } >> /tmp/summary.md

      - name: Note it when the AI step fails
        if: steps.check.outputs.enabled == 'true' && steps.ai.outcome != 'success'
        run: |
          {
            echo
            echo "_🤖 Copilot summary was not generated this time — check the 'Ask Copilot for a summary' step in the workflow logs._"
          } >> /tmp/summary.md

      - name: Comment on the PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: merge-summary
          number: ${{ github.event.pull_request.number }}
          path: /tmp/summary.md

      - name: Show it on the Actions run too
        if: always()
        run: cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY"
